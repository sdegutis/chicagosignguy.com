<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicago Sign Guy - Chicago Sign Guy's Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Mako&display=swap" rel="stylesheet">
  <style>
    /* Wow, I got really lucky with these colors;
   light and dark mode have perfect inverses,
   and it's entirely made up of named colors! */

    html {
      --b: antiquewhite;
      --f: darkslategray;
      --h: deeppink;
      --l: royalblue;
    }

    @media (prefers-color-scheme: dark) {
      html {
        --b: black;
        --f: blanchedalmond;
        --h: hotpink;
        --l: cornflowerblue;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: light dark;
      font-family: "EB Garamond", serif;
      background-color: var(--b);
      font-size: max(12pt, min(3vh, 4vw));
      color: var(--f);
    }

    h1,
    h2,
    h3 {
      font-family: "Libre Caslon Text", serif;
      color: var(--h);
      font-weight: normal;
      font-variant: all-small-caps;
    }

    a {
      color: var(--l);
      text-underline-offset: 3px;
    }

    footer {
      font-family: "Mako", sans-serif;
      font-optical-sizing: auto;
      padding-top: 1em;
      font-size: small;
      color: var(--h);
      text-decoration: overline;
    }

    body {
      max-width: 30rem;
      width: 90%;
      margin: 0 auto 3em;
    }

    img {
      max-width: 100%;
    }

    .combinedcoverbook {
      display: grid;
      grid-template-columns: 45% 45%;
    }
  </style>
</head>

<body>
  <header>
    <h1>Chicago Sign Guy</h1>
  </header>
  <main>
    <article>
      <p>Hi, I'm Steven.</p>
      <p>I've published three books:</p>

      <a class='combinedcoverbook' href='https://www.amazon.com/dp/B0CPDFKGLT'>
        <img src='cover6b.jpg' alt="Cover 6b" />
        <img src='cover6a.jpg' alt="Cover 6a" />
      </a>
      <a style='display: inline-block; max-width: 90%' href='https://www.amazon.com/dp/B0DS2N3GH2'>
        <img src='cover7c.png' alt="Cover 7c" />
      </a>
      <a class='combinedcoverbook' href='https://www.amazon.com/dp/B0CY257G9W'>
        <img src='cover8b.jpg' alt="Cover 8b" />
        <img src='cover8a.jpg' alt="Cover 8a" />
      </a>


      <p>I'm working on a few more books:</p>

      <img src='cover1.png' alt="Cover 1" />
      <img src='cover2.png' alt="Cover 2" />
      <img src='cover3.png' alt="Cover 3" />
      <!-- <img src='cover4.png' alt="Cover 4" /> -->
      <img src='cover5.png' alt="Cover 5" />

      <p>You can email me at <a href="mailto:steven@chicagosignguy.com">steven@chicagosignguy.com</a>.</p>
    </article>

  </main>
  <footer>© 2025-2026 ChicagoSignGuy.com, All Rights Reserved.</footer>
</body>

</html>
